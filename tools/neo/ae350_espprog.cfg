# OpenOCD (système 0.11.0+dev, ou GMD 2025.01 si libftdi 0.x installée) : AE350 de la Tang Console 138K par une sonde ESP-Prog.
# ESP-Prog = FT2232HL, canal A = JTAG (ADBUS0-3 : TCK TDI TDO TMS), canal B = UART.
# Disposition reprise de openocd-esp32 tcl/interface/ftdi/esp_ftdi.cfg (2026-09-19).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0xf00b
transport select jtag

# ATTENTION : le debugger Sipeed de la Console (BL616) se présente aussi en 0403:6010
# (produit « USB Debugger », série 2025041420). L'ESP-Prog se distingue par sa chaîne produit
# FTDI d'origine « Dual RS232-HS » (sans numéro de série) : sélection par description, indépendante
# du port USB. Sans cette ligne OpenOCD prendrait le premier 0403:6010 trouvé.
ftdi device_desc "Dual RS232-HS"

# Vitesse prudente pour la mise au point ; à monter une fois la chaîne validée.
adapter speed 1000

# Cible Andes RISC-V : copie de target/nds32v5.cfg de l'OpenOCD de GMD (irlen 5, idcode
# 0x1000563D), inlinée pour rester utilisable avec l'OpenOCD système (/usr/local/bin/openocd,
# 0.11.0+dev 2025-10-24) : le binaire GMD exige libftdi.so.1 (libftdi 0.x), absent ici.
set _CHIPNAME nds
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x1000563D
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
